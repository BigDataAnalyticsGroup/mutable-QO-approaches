systems:
    mutable:
        args: >- # use injected CE only to force join with A, i.e. fact table, to occur at first in PEall
            --backend WasmV8
            --dryrun
            --cardinality-estimator Injected
            --use-cardinality-file benchmark/holistic-optimization/optimization_time-star.json
        configurations:
            'split (DPccp)':
                args: --optimizer-split --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
            'split (PEall)':
                args: --optimizer-split --plan-enumerator PEall
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
            'top-2 (DPccp)':
                args: --optimizer-topk 2 --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the top-k logical query plans:.*'
                    Optimization Time (physical): '^Compute the top-k physical query plans:.*'
            'top-2 (PEall)':
                args: --optimizer-topk 2 --plan-enumerator PEall
                pattern:
                    Optimization Time (algebraic): '^Compute the top-k logical query plans:.*'
                    Optimization Time (physical): '^Compute the top-k physical query plans:.*'
            'top-5 (DPccp)':
                args: --optimizer-topk 5 --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the top-k logical query plans:.*'
                    Optimization Time (physical): '^Compute the top-k physical query plans:.*'
            'top-5 (PEall)':
                args: --optimizer-topk 5 --plan-enumerator PEall
                pattern:
                    Optimization Time (algebraic): '^Compute the top-k logical query plans:.*'
                    Optimization Time (physical): '^Compute the top-k physical query plans:.*'
            'top-10 (DPccp)':
                args: --optimizer-topk 10 --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the top-k logical query plans:.*'
                    Optimization Time (physical): '^Compute the top-k physical query plans:.*'
            'top-10 (PEall)':
                args: --optimizer-topk 10 --plan-enumerator PEall
                pattern:
                    Optimization Time (algebraic): '^Compute the top-k logical query plans:.*'
                    Optimization Time (physical): '^Compute the top-k physical query plans:.*'
            'holistic (DPccp)':
                args: --optimizer-holistic --plan-enumerator DPccp
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
            'holistic (PEall)':
                args: --optimizer-holistic --plan-enumerator PEall
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
        cases:
            2: >-
                SELECT 1
                FROM A, B
                WHERE A.bid = B.id;
            3: >-
                SELECT 1
                FROM A, B, C
                WHERE A.bid = B.id AND A.cid = C.id;
            4: >-
                SELECT 1
                FROM A, B, C, D
                WHERE A.bid = B.id AND A.cid = C.id AND A.did = D.id;
            5: >-
                SELECT 1
                FROM A, B, C, D, E
                WHERE A.bid = B.id AND A.cid = C.id AND A.did = D.id AND A.eid = E.id;
            6: >-
                SELECT 1
                FROM A, B, C, D, E, F
                WHERE A.bid = B.id AND A.cid = C.id AND A.did = D.id AND A.eid = E.id AND A.fid = F.id;
            7: >-
                SELECT 1
                FROM A, B, C, D, E, F, G
                WHERE A.bid = B.id AND A.cid = C.id AND A.did = D.id AND A.eid = E.id AND A.fid = F.id AND A.gid = G.id;
            8: >-
                SELECT 1
                FROM A, B, C, D, E, F, G, H
                WHERE A.bid = B.id AND A.cid = C.id AND A.did = D.id AND A.eid = E.id AND A.fid = F.id AND A.gid = G.id
                      AND A.hid = H.id;
            9: >-
                SELECT 1
                FROM A, B, C, D, E, F, G, H, I
                WHERE A.bid = B.id AND A.cid = C.id AND A.did = D.id AND A.eid = E.id AND A.fid = F.id AND A.gid = G.id
                      AND A.hid = H.id AND A.iid = I.id;
            10: >-
                SELECT 1
                FROM A, B, C, D, E, F, G, H, I, J
                WHERE A.bid = B.id AND A.cid = C.id AND A.did = D.id AND A.eid = E.id AND A.fid = F.id AND A.gid = G.id
                      AND A.hid = H.id AND A.iid = I.id AND A.jid = J.id;
