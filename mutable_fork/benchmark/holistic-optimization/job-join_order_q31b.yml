description: IMDb benchmark exploiting different join order. JOB Q31b.
suite: holistic-optimization
benchmark: job
name: join order (q31b)
readonly: true
data:
    'title':
        file: 'benchmark/job/data/title.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':              'INT NOT NULL PRIMARY KEY'
            'title':           'CHAR 100 NOT NULL'
            'imdb_index':      'CHAR 5'
            'kind_id':         'INT NOT NULL'
            'production_year': 'INT'
            'imdb_id':         'INT'
            'phonetic_code':   'CHAR 5'
            'episode_of_id':   'INT'
            'season_nr':       'INT'
            'episode_nr':      'INT'
            'series_years':    'CHAR 49'
            'md5sum':          'CHAR 32'
        indexes:
            'id_title':
                attributes: 'id'
            'title_title':
                attributes: 'title'
            'imdb_index_title':
                attributes: 'imdb_index'
            'kind_id_title':
                attributes: 'kind_id'
            'production_year_title':
                attributes: 'production_year'
            'imdb_id_title':
                attributes: 'imdb_id'
            'phonetic_code_title':
                attributes: 'phonetic_code'
            'episode_of_id_title':
                attributes: 'episode_of_id'
            'season_nr_title':
                attributes: 'season_nr'
            'episode_nr_title':
                attributes: 'episode_nr'
            'series_years_title':
                attributes: 'series_years'
            'md5sum_title':
                attributes: 'md5sum'
    'movie_info':
        file: 'benchmark/job/data/movie_info.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':           'INT NOT NULL PRIMARY KEY'
            'movie_id':     'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info':         'CHAR 100 NOT NULL'
            'note':         'CHAR 100'
        indexes:
            'id_movie_info':
                attributes: 'id'
            'movie_id_movie_info':
                attributes: 'movie_id'
            'info_type_id_movie_info':
                attributes: 'info_type_id'
            'info_movie_info':
                attributes: 'info'
            'note_movie_info':
                attributes: 'note'
    'name':
        file: 'benchmark/job/data/name.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':            'INT NOT NULL PRIMARY KEY'
            'name':          'CHAR 100 NOT NULL'
            'imdb_index':    'CHAR 9'
            'imdb_id':       'INT'
            'gender':        'CHAR 1'
            'name_pcode_cf': 'CHAR 5'
            'name_pcode_nf': 'CHAR 5'
            'surname_pcode': 'CHAR 5'
            'md5sum':        'CHAR 32'
        indexes:
            'id_name':
                attributes: 'id'
            'name_name':
                attributes: 'name'
            'imdb_index_name':
                attributes: 'imdb_index'
            'imdb_id_name':
                attributes: 'imdb_id'
            'gender_name':
                attributes: 'gender'
            'name_pcode_cf_name':
                attributes: 'name_pcode_cf'
            'name_pcode_nf_name':
                attributes: 'name_pcode_nf'
            'surname_pcode_name':
                attributes: 'surname_pcode'
            'md5sum_name':
                attributes: 'md5sum'
    'movie_info_idx':
        file: 'benchmark/job/data/movie_info_idx.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':           'INT NOT NULL PRIMARY KEY'
            'movie_id':     'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info':         'CHAR 100 NOT NULL'
            'note':         'CHAR 1'
        indexes:
            'id_movie_info_idx':
                attributes: 'id'
            'movie_id_movie_info_idx':
                attributes: 'movie_id'
            'info_type_id_movie_info_idx':
                attributes: 'info_type_id'
            'info_movie_info_idx':
                attributes: 'info'
            'note_movie_info_idx':
                attributes: 'note'
    'movie_keyword':
        file: 'benchmark/job/data/movie_keyword.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':         'INT NOT NULL PRIMARY KEY'
            'movie_id':   'INT NOT NULL'
            'keyword_id': 'INT NOT NULL'
        indexes:
            'id_movie_keyword':
                attributes: 'id'
            'movie_id_movie_keyword':
                attributes: 'movie_id'
            'keyword_id_movie_keyword':
                attributes: 'keyword_id'
    'movie_companies':
        file: 'benchmark/job/data/movie_companies.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':              'INT NOT NULL PRIMARY KEY'
            'movie_id':        'INT NOT NULL'
            'company_id':      'INT NOT NULL'
            'company_type_id': 'INT NOT NULL'
            'note':            'CHAR 100'
        indexes:
            'id_movie_companies':
                attributes: 'id'
            'movie_id_movie_companies':
                attributes: 'movie_id'
            'company_id_movie_companies':
                attributes: 'company_id'
            'company_type_id_movie_companies':
                attributes: 'company_type_id'
            'note_movie_companies':
                attributes: 'note'
    'cast_info':
        file: 'benchmark/job/data/cast_info.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':             'INT NOT NULL PRIMARY KEY'
            'person_id':      'INT NOT NULL'
            'movie_id':       'INT NOT NULL'
            'person_role_id': 'INT'
            'note':           'CHAR 100'
            'nr_order':       'INT'
            'role_id':        'INT NOT NULL'
        indexes:
            'id_cast_info':
                attributes: 'id'
            'person_id_cast_info':
                attributes: 'person_id'
            'movie_id_cast_info':
                attributes: 'movie_id'
            'person_role_id_cast_info':
                attributes: 'person_role_id'
            'note_cast_info':
                attributes: 'note'
            'nr_order_cast_info':
                attributes: 'nr_order'
            'role_id_cast_info':
                attributes: 'role_id'
    'company_name':
        file: 'benchmark/job/data/company_name.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':            'INT NOT NULL PRIMARY KEY'
            'name':          'CHAR 100 NOT NULL'
            'country_code':  'CHAR 6'
            'imdb_id':       'INT'
            'name_pcode_nf': 'CHAR 5'
            'name_pcode_sf': 'CHAR 5'
            'md5sum':        'CHAR 32'
        indexes:
            'id_company_name':
                attributes: 'id'
            'name_company_name':
                attributes: 'name'
            'country_code_company_name':
                attributes: 'country_code'
            'imdb_id_company_name':
                attributes: 'imdb_id'
            'name_pcode_nf_company_name':
                attributes: 'name_pcode_nf'
            'name_pcode_sf_company_name':
                attributes: 'name_pcode_sf'
            'md5sum_company_name':
                attributes: 'md5sum'
    'info_type':
        file: 'benchmark/job/data/info_type.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':   'INT NOT NULL PRIMARY KEY'
            'info': 'CHAR 32 NOT NULL'
        indexes:
            'id_info_type':
                attributes: 'id'
            'info_info_type':
                attributes: 'info'
    'keyword':
        file: 'benchmark/job/data/keyword.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':            'INT NOT NULL PRIMARY KEY'
            'keyword':       'CHAR 100 NOT NULL'
            'phonetic_code': 'CHAR 5'
        indexes:
            'id_keyword':
                attributes: 'id'
            'keyword_keyword':
                attributes: 'keyword'
            'phonetic_code_keyword':
                attributes: 'phonetic_code'
systems:
    mutable:
        args: >-
            --backend WasmV8
            --cardinality-estimator Injected
            --use-cardinality-file benchmark/holistic-optimization/job-join_order_q31b.json
        configurations:
            'split (DPccp)':
                args: --optimizer-split --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'split (PEall)':
                args: --optimizer-split --plan-enumerator PEall
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'holistic (DPccp)':
                args: --optimizer-holistic --plan-enumerator DPccp
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'holistic (PEall)':
                args: --optimizer-holistic --plan-enumerator PEall
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
        cases:
            dummy: >-
                SELECT t.title, mi.info, miidx.info, n.name
                FROM
                    title AS t,
                    keyword AS k,
                    company_name AS cn,
                    info_type AS it1,
                    info_type AS it2,
                    movie_companies AS mc,
                    cast_info AS ci,
                    movie_info AS mi,
                    movie_info_idx AS miidx,
                    movie_keyword AS mk,
                    name AS n
                WHERE
                    t.production_year > 2000 AND
                    (t.title LIKE "%Freddy%" OR t.title LIKE "%Jason%" OR t.title LIKE "Saw%") AND
                    (k.keyword = "murder" OR k.keyword = "violence" OR k.keyword = "blood" OR k.keyword = "gore" OR k.keyword = "death" OR k.keyword = "female-nudity" OR k.keyword = "hospital") AND
                    cn.name LIKE "Lionsgate%" AND
                    it1.info = "genres" AND
                    it2.info = "votes" AND
                    mc.note LIKE "%(Blu-ray)%" AND
                    (ci.note = "(writer)" OR ci.note = "(head writer)" OR ci.note = "(written by)" OR ci.note = "(story)" OR ci.note = "(story editor)") AND
                    (mi.info = "Horror" OR mi.info = "Thriller") AND
                    n.gender = "m" AND
                    miidx.movie_id = t.id AND
                    mi.movie_id = t.id AND
                    mi.movie_id = mc.movie_id AND
                    n.id = ci.person_id AND
                    it1.id = mi.info_type_id AND
                    mi.movie_id = miidx.movie_id AND
                    it2.id = miidx.info_type_id AND
                    cn.id = mc.company_id AND
                    ci.movie_id = t.id AND
                    miidx.movie_id = mk.movie_id AND
                    ci.movie_id = mk.movie_id AND
                    mi.movie_id = mk.movie_id AND
                    k.id = mk.keyword_id AND
                    mc.movie_id = t.id AND
                    mk.movie_id = t.id AND
                    ci.movie_id = miidx.movie_id AND
                    miidx.movie_id = mc.movie_id AND
                    ci.movie_id = mc.movie_id AND
                    mk.movie_id = mc.movie_id AND
                    ci.movie_id = mi.movie_id;
