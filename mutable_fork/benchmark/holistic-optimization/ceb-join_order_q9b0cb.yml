description: IMDb benchmark exploiting different join order. CEB Q9b0cb.
suite: holistic-optimization
benchmark: ceb
name: join order (q9b0cb)
readonly: true
data:
    'kind_type':
        file: 'benchmark/job/data/kind_type.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':   'INT NOT NULL PRIMARY KEY'
            'kind': 'CHAR 15'
        indexes:
            'id_kind_type':
                attributes: 'id'
            'kind_kind_type':
                attributes: 'kind'
    'info_type':
        file: 'benchmark/job/data/info_type.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':   'INT NOT NULL PRIMARY KEY'
            'info': 'CHAR 32 NOT NULL'
        indexes:
            'id_info_type':
                attributes: 'id'
            'info_info_type':
                attributes: 'info'
        indexes:
            'id_info_type':
                attributes: 'id'
    'movie_info':
        file: 'benchmark/job/data/movie_info.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':           'INT NOT NULL PRIMARY KEY'
            'movie_id':     'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info':         'CHAR 100 NOT NULL'
            'note':         'CHAR 100'
        indexes:
            'id_movie_info':
                attributes: 'id'
            'movie_id_movie_info':
                attributes: 'movie_id'
            'info_type_id_movie_info':
                attributes: 'info_type_id'
            'info_movie_info':
                attributes: 'info'
            'note_movie_info':
                attributes: 'note'
    'title':
        file: 'benchmark/job/data/title.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':              'INT NOT NULL PRIMARY KEY'
            'title':           'CHAR 100 NOT NULL'
            'imdb_index':      'CHAR 5'
            'kind_id':         'INT NOT NULL'
            'production_year': 'INT'
            'imdb_id':         'INT'
            'phonetic_code':   'CHAR 5'
            'episode_of_id':   'INT'
            'season_nr':       'INT'
            'episode_nr':      'INT'
            'series_years':    'CHAR 49'
            'md5sum':          'CHAR 32'
        indexes:
            'id_title':
                attributes: 'id'
            'title_title':
                attributes: 'title'
            'imdb_index_title':
                attributes: 'imdb_index'
            'kind_id_title':
                attributes: 'kind_id'
            'production_year_title':
                attributes: 'production_year'
            'imdb_id_title':
                attributes: 'imdb_id'
            'phonetic_code_title':
                attributes: 'phonetic_code'
            'episode_of_id_title':
                attributes: 'episode_of_id'
            'season_nr_title':
                attributes: 'season_nr'
            'episode_nr_title':
                attributes: 'episode_nr'
            'series_years_title':
                attributes: 'series_years'
            'md5sum_title':
                attributes: 'md5sum'
    'name':
        file: 'benchmark/job/data/name.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':            'INT NOT NULL PRIMARY KEY'
            'name':          'CHAR 100 NOT NULL'
            'imdb_index':    'CHAR 9'
            'imdb_id':       'INT'
            'gender':        'CHAR 1'
            'name_pcode_cf': 'CHAR 5'
            'name_pcode_nf': 'CHAR 5'
            'surname_pcode': 'CHAR 5'
            'md5sum':        'CHAR 32'
        indexes:
            'id_name':
                attributes: 'id'
            'name_name':
                attributes: 'name'
            'imdb_index_name':
                attributes: 'imdb_index'
            'imdb_id_name':
                attributes: 'imdb_id'
            'gender_name':
                attributes: 'gender'
            'name_pcode_cf_name':
                attributes: 'name_pcode_cf'
            'name_pcode_nf_name':
                attributes: 'name_pcode_nf'
            'surname_pcode_name':
                attributes: 'surname_pcode'
            'md5sum_name':
                attributes: 'md5sum'
    'cast_info':
        file: 'benchmark/job/data/cast_info.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':             'INT NOT NULL PRIMARY KEY'
            'person_id':      'INT NOT NULL'
            'movie_id':       'INT NOT NULL'
            'person_role_id': 'INT'
            'note':           'CHAR 100'
            'nr_order':       'INT'
            'role_id':        'INT NOT NULL'
        indexes:
            'id_cast_info':
                attributes: 'id'
            'person_id_cast_info':
                attributes: 'person_id'
            'movie_id_cast_info':
                attributes: 'movie_id'
            'person_role_id_cast_info':
                attributes: 'person_role_id'
            'note_cast_info':
                attributes: 'note'
            'nr_order_cast_info':
                attributes: 'nr_order'
            'role_id_cast_info':
                attributes: 'role_id'
    'role_type':
        file: 'benchmark/job/data/role_type.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':   'INT NOT NULL PRIMARY KEY'
            'role': 'CHAR 32 NOT NULL'
        indexes:
            'id_role_type':
                attributes: 'id'
            'role_role_type':
                attributes: 'role'
    'person_info':
        file: 'benchmark/job/data/person_info.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':           'INT NOT NULL PRIMARY KEY'
            'person_id':    'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info':         'CHAR 100 NOT NULL'
            'note':         'CHAR 100'
        indexes:
            'id_person_info':
                attributes: 'id'
            'person_id_person_info':
                attributes: 'person_id'
            'info_type_id_person_info':
                attributes: 'info_type_id'
            'info_person_info':
                attributes: 'info'
            'note_person_info':
                attributes: 'note'
systems:
    mutable:
        args: >-
            --backend WasmV8
            --cardinality-estimator Injected
            --use-cardinality-file benchmark/holistic-optimization/ceb-join_order_q9b0cb.json
        configurations:
            'split (DPccp)':
                args: --optimizer-split --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'split (PEall)':
                args: --optimizer-split --plan-enumerator PEall
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'holistic (DPccp)':
                args: --optimizer-holistic --plan-enumerator DPccp
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'holistic (PEall)':
                args: --optimizer-holistic --plan-enumerator PEall
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
        cases:
            dummy: >-
                SELECT n.name
                FROM
                    kind_type AS kt,
                    info_type AS it2,
                    movie_info AS mi,
                    title AS t,
                    name AS n,
                    info_type AS it1,
                    cast_info AS ci,
                    role_type AS rt,
                    person_info AS pi
                WHERE
                    (kt.kind = "episode" OR kt.kind = "movie" OR kt.kind = "tv series") AND
                    it2.id = 24 AND
                    (mi.info = "70 mm 6-Track" OR mi.info = "Brazil:16" OR mi.info = "Canada:PA" OR mi.info = "Canada:R" OR mi.info = "Finland:(Banned)" OR mi.info = "Germany:o.Al." OR mi.info = "Iceland:L" OR mi.info = "Ireland:12A" OR mi.info = "Ireland:PG" OR mi.info = "Italy:VM14" OR mi.info = "New Zealand:PG" OR mi.info = "Peru:18" OR mi.info = "Philippines:G" OR mi.info = "Philippines:R-13" OR mi.info = "Portugal:M/16" OR mi.info = "Singapore:PG13" OR mi.info = "South Korea:12" OR mi.info = "Spain:7") AND
                    t.production_year <= 2015 AND
                    t.production_year >= 1925 AND
                    n.name LIKE "%fr%" AND
                    (it1.id = 2 OR it1.id = 5 OR it1.id = 6) AND
                    (rt.role = "cinematographer" OR rt.role = "composer" OR rt.role = "editor" OR rt.role = "writer") AND
                    rt.id = ci.role_id AND
                    n.id = pi.person_id AND
                    t.id = mi.movie_id AND
                    mi.movie_id = ci.movie_id AND
                    mi.info_type_id = it1.id AND
                    t.kind_id = kt.id AND
                    t.id = ci.movie_id AND
                    pi.info_type_id = it2.id AND
                    n.id = ci.person_id;
