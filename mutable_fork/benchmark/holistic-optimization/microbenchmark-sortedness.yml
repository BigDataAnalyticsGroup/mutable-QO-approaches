description: Microbenchmark exploiting sortedness.
suite: holistic-optimization
benchmark: microbenchmark
name: sortedness
readonly: true
data:
    'R_sortedness':
        file: 'benchmark/holistic-optimization/data/R_sortedness.csv'
        format: 'csv'
        delimiter: ','
        header: 1
        attributes:
            'id':  'INT NOT NULL PRIMARY KEY'
            'val': 'INT NOT NULL'
        scale_factors:
            1.0:    1.0
            0.5:    0.5
            0.25:   0.25
            0.125:  0.125
            0.0625: 0.0625
    'S_sortedness':
        file: 'benchmark/holistic-optimization/data/S_sortedness.csv'
        format: 'csv'
        delimiter: ','
        header: 1
        attributes:
            'id':  'INT NOT NULL PRIMARY KEY REFERENCES R_sortedness(id)'
            'val': 'INT NOT NULL'
        scale_factors:
            1.0:    1.0
            0.5:    0.5
            0.25:   0.25
            0.125:  0.125
            0.0625: 0.0625
    'T_sortedness':
        file: 'benchmark/holistic-optimization/data/T_sortedness.csv'
        format: 'csv'
        delimiter: ','
        header: 1
        attributes:
            'rid': 'INT NOT NULL REFERENCES R_sortedness(id)'
            'uid': 'INT NOT NULL'
            'val': 'INT NOT NULL'
        scale_factors:
            1.0:    1.0
            0.5:    0.5
            0.25:   0.25
            0.125:  0.125
            0.0625: 0.0625
systems:
    mutable:
        args: >-
            --backend WasmV8
            --cardinality-estimator Injected
            --use-cardinality-file benchmark/holistic-optimization/microbenchmark-sortedness_1.json
            --xxx-asc-sorted-attributes R.id,S.id
        configurations:
            'split (DPccp)':
                args: --optimizer-split --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'split (PEall)':
                args: --optimizer-split --plan-enumerator PEall
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'top-2 (DPccp)':
                args: --optimizer-topk 2 --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the top-k logical query plans:.*'
                    Optimization Time (physical): '^Compute the top-k physical query plans:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'top-2 (PEall)':
                args: --optimizer-topk 2 --plan-enumerator PEall
                pattern:
                    Optimization Time (algebraic): '^Compute the top-k logical query plans:.*'
                    Optimization Time (physical): '^Compute the top-k physical query plans:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'holistic (DPccp)':
                args: --optimizer-holistic --plan-enumerator DPccp
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'holistic (PEall)':
                args: --optimizer-holistic --plan-enumerator PEall
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
        cases:
            1.0: >-
                SELECT 1
                FROM R_sortedness AS R, S_sortedness AS S, T_sortedness AS T
                WHERE R.id = S.id AND S.id = T.rid;
            0.5: >-
                SELECT 1
                FROM R_sortedness AS R, S_sortedness AS S, T_sortedness AS T
                WHERE R.id = S.id AND S.id = T.rid;
            0.25: >-
                SELECT 1
                FROM R_sortedness AS R, S_sortedness AS S, T_sortedness AS T
                WHERE R.id = S.id AND S.id = T.rid;
            0.125: >-
                SELECT 1
                FROM R_sortedness AS R, S_sortedness AS S, T_sortedness AS T
                WHERE R.id = S.id AND S.id = T.rid;
            0.0625: >-
                SELECT 1
                FROM R_sortedness AS R, S_sortedness AS S, T_sortedness AS T
                WHERE R.id = S.id AND S.id = T.rid;
