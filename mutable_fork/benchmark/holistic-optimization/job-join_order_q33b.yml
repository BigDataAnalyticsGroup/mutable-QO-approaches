description: IMDb benchmark exploiting different join order. JOB Q33b.
suite: holistic-optimization
benchmark: job
name: join order (q33b)
readonly: true
data:
    'title':
        file: 'benchmark/job/data/title.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':              'INT NOT NULL PRIMARY KEY'
            'title':           'CHAR 100 NOT NULL'
            'imdb_index':      'CHAR 5'
            'kind_id':         'INT NOT NULL'
            'production_year': 'INT'
            'imdb_id':         'INT'
            'phonetic_code':   'CHAR 5'
            'episode_of_id':   'INT'
            'season_nr':       'INT'
            'episode_nr':      'INT'
            'series_years':    'CHAR 49'
            'md5sum':          'CHAR 32'
        indexes:
            'id_title':
                attributes: 'id'
            'title_title':
                attributes: 'title'
            'imdb_index_title':
                attributes: 'imdb_index'
            'kind_id_title':
                attributes: 'kind_id'
            'production_year_title':
                attributes: 'production_year'
            'imdb_id_title':
                attributes: 'imdb_id'
            'phonetic_code_title':
                attributes: 'phonetic_code'
            'episode_of_id_title':
                attributes: 'episode_of_id'
            'season_nr_title':
                attributes: 'season_nr'
            'episode_nr_title':
                attributes: 'episode_nr'
            'series_years_title':
                attributes: 'series_years'
            'md5sum_title':
                attributes: 'md5sum'
    'movie_link':
        file: 'benchmark/job/data/movie_link.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':              'INT NOT NULL PRIMARY KEY'
            'movie_id':        'INT NOT NULL'
            'linked_movie_id': 'INT NOT NULL'
            'link_type_id':    'INT NOT NULL'
        indexes:
            'id_movie_link':
                attributes: 'id'
            'movie_id_movie_link':
                attributes: 'movie_id'
            'linked_movie_id_movie_link':
                attributes: 'linked_movie_id'
            'link_type_id_movie_link':
                attributes: 'link_type_id'
    'kind_type':
        file: 'benchmark/job/data/kind_type.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':   'INT NOT NULL PRIMARY KEY'
            'kind': 'CHAR 15'
        indexes:
            'id_kind_type':
                attributes: 'id'
            'kind_kind_type':
                attributes: 'kind'
    'link_type':
        file: 'benchmark/job/data/link_type.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':   'INT NOT NULL PRIMARY KEY'
            'link': 'CHAR 32 NOT NULL'
        indexes:
            'id_link_type':
                attributes: 'id'
            'link_link_type':
                attributes: 'link'
    'movie_companies':
        file: 'benchmark/job/data/movie_companies.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':              'INT NOT NULL PRIMARY KEY'
            'movie_id':        'INT NOT NULL'
            'company_id':      'INT NOT NULL'
            'company_type_id': 'INT NOT NULL'
            'note':            'CHAR 100'
        indexes:
            'id_movie_companies':
                attributes: 'id'
            'movie_id_movie_companies':
                attributes: 'movie_id'
            'company_id_movie_companies':
                attributes: 'company_id'
            'company_type_id_movie_companies':
                attributes: 'company_type_id'
            'note_movie_companies':
                attributes: 'note'
    'movie_info_idx':
        file: 'benchmark/job/data/movie_info_idx.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':           'INT NOT NULL PRIMARY KEY'
            'movie_id':     'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info':         'CHAR 100 NOT NULL'
            'note':         'CHAR 1'
        indexes:
            'id_movie_info_idx':
                attributes: 'id'
            'movie_id_movie_info_idx':
                attributes: 'movie_id'
            'info_type_id_movie_info_idx':
                attributes: 'info_type_id'
            'info_movie_info_idx':
                attributes: 'info'
            'note_movie_info_idx':
                attributes: 'note'
    'company_name':
        file: 'benchmark/job/data/company_name.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':            'INT NOT NULL PRIMARY KEY'
            'name':          'CHAR 100 NOT NULL'
            'country_code':  'CHAR 6'
            'imdb_id':       'INT'
            'name_pcode_nf': 'CHAR 5'
            'name_pcode_sf': 'CHAR 5'
            'md5sum':        'CHAR 32'
        indexes:
            'id_company_name':
                attributes: 'id'
            'name_company_name':
                attributes: 'name'
            'country_code_company_name':
                attributes: 'country_code'
            'imdb_id_company_name':
                attributes: 'imdb_id'
            'name_pcode_nf_company_name':
                attributes: 'name_pcode_nf'
            'name_pcode_sf_company_name':
                attributes: 'name_pcode_sf'
            'md5sum_company_name':
                attributes: 'md5sum'
    'info_type':
        file: 'benchmark/job/data/info_type.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':   'INT NOT NULL PRIMARY KEY'
            'info': 'CHAR 32 NOT NULL'
        indexes:
            'id_info_type':
                attributes: 'id'
            'info_info_type':
                attributes: 'info'
systems:
    mutable:
        args: >-
            --backend WasmV8
            --cardinality-estimator Injected
            --use-cardinality-file benchmark/holistic-optimization/job-join_order_q33b.json
        configurations:
            'split (DPccp)':
                args: --optimizer-split --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
            'top-5 (DPccp)':
                args: --optimizer-topk 5 --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the top-k logical query plans:.*'
                    Optimization Time (physical): '^Compute the top-k physical query plans:.*'
                    Execution Time: '^Execute query:.*'
            'top-10 (DPccp)':
                args: --optimizer-topk 10 --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the top-k logical query plans:.*'
                    Optimization Time (physical): '^Compute the top-k physical query plans:.*'
                    Execution Time: '^Execute query:.*'
            'holistic with pruning (DPccp)':
                args: --optimizer-holistic --enable-initialized-cost-based-pruning --plan-enumerator DPccp
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
            'holistic (DPccp)':
                args: --optimizer-holistic --plan-enumerator DPccp
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
#            'auto':
#                args: --dryrun
#                pattern:
#                    dummy: '^.*:.*'
        cases:
            dummy: >-
                SELECT miidx2.info, t1.title, t2.title, cn1.name, cn2.name, mi_idx1.info
                FROM
                    movie_info_idx AS miidx2,
                    movie_link AS ml,
                    title AS t1,
                    title AS t2,
                    kind_type AS kt1,
                    company_name AS cn1,
                    company_name AS cn2,
                    info_type AS it1,
                    kind_type AS kt2,
                    info_type AS it2,
                    link_type AS lt,
                    movie_companies AS mc1,
                    movie_companies AS mc2,
                    movie_info_idx AS mi_idx1
                WHERE
                    miidx2.info < "3.0" AND
                    t2.production_year = 2007 AND
                    kt1.kind = "tv series" AND
                    cn1.country_code = "[nl]" AND
                    it1.info = "rating" AND
                    kt2.kind = "tv series" AND
                    it2.info = "rating" AND
                    lt.link LIKE "%follow%" AND
                    lt.id = ml.link_type_id AND
                    kt1.id = t1.kind_id AND
                    kt2.id = t2.kind_id AND
                    cn1.id = mc1.company_id AND
                    cn2.id = mc2.company_id AND
                    t2.id = ml.linked_movie_id AND
                    it1.id = mi_idx1.info_type_id AND
                    it2.id = miidx2.info_type_id AND
                    t2.id = miidx2.movie_id AND
                    t1.id = mi_idx1.movie_id AND
                    mi_idx1.movie_id = mc1.movie_id AND
                    miidx2.movie_id = mc2.movie_id AND
                    ml.linked_movie_id = mc2.movie_id AND
                    ml.movie_id = mc1.movie_id AND
                    t2.id = mc2.movie_id AND
                    t1.id = mc1.movie_id AND
                    ml.movie_id = mi_idx1.movie_id AND
                    ml.linked_movie_id = miidx2.movie_id AND
                    t1.id = ml.movie_id;
