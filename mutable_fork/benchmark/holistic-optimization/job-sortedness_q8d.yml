description: IMDb benchmark exploiting sortedness. JOB Q8d.
suite: holistic-optimization
benchmark: job
name: sortedness (q8d)
readonly: true
data:
    'name':
        file: 'benchmark/job/data/name.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':            'INT NOT NULL PRIMARY KEY'
            'name':          'CHAR 100 NOT NULL'
            'imdb_index':    'CHAR 9'
            'imdb_id':       'INT'
            'gender':        'CHAR 1'
            'name_pcode_cf': 'CHAR 5'
            'name_pcode_nf': 'CHAR 5'
            'surname_pcode': 'CHAR 5'
            'md5sum':        'CHAR 32'
        indexes:
            'id_name':
                attributes: 'id'
            'name_name':
                attributes: 'name'
            'imdb_index_name':
                attributes: 'imdb_index'
            'imdb_id_name':
                attributes: 'imdb_id'
            'gender_name':
                attributes: 'gender'
            'name_pcode_cf_name':
                attributes: 'name_pcode_cf'
            'name_pcode_nf_name':
                attributes: 'name_pcode_nf'
            'surname_pcode_name':
                attributes: 'surname_pcode'
            'md5sum_name':
                attributes: 'md5sum'
    'role_type':
        file: 'benchmark/job/data/role_type.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':   'INT NOT NULL PRIMARY KEY'
            'role': 'CHAR 32 NOT NULL'
        indexes:
            'id_role_type':
                attributes: 'id'
            'role_role_type':
                attributes: 'role'
        indexes:
            'id_role_type':
                attributes: 'id'
            'role_role_type':
                attributes: 'role'
    'title':
        file: 'benchmark/job/data/title.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':              'INT NOT NULL PRIMARY KEY'
            'title':           'CHAR 100 NOT NULL'
            'imdb_index':      'CHAR 5'
            'kind_id':         'INT NOT NULL'
            'production_year': 'INT'
            'imdb_id':         'INT'
            'phonetic_code':   'CHAR 5'
            'episode_of_id':   'INT'
            'season_nr':       'INT'
            'episode_nr':      'INT'
            'series_years':    'CHAR 49'
            'md5sum':          'CHAR 32'
        indexes:
            'id_title':
                attributes: 'id'
            'title_title':
                attributes: 'title'
            'imdb_index_title':
                attributes: 'imdb_index'
            'kind_id_title':
                attributes: 'kind_id'
            'production_year_title':
                attributes: 'production_year'
            'imdb_id_title':
                attributes: 'imdb_id'
            'phonetic_code_title':
                attributes: 'phonetic_code'
            'episode_of_id_title':
                attributes: 'episode_of_id'
            'season_nr_title':
                attributes: 'season_nr'
            'episode_nr_title':
                attributes: 'episode_nr'
            'series_years_title':
                attributes: 'series_years'
            'md5sum_title':
                attributes: 'md5sum'
    'aka_name':
        file: 'benchmark/job/data/aka_name.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL PRIMARY KEY'
            'person_id': 'INT NOT NULL'
            'name': 'CHAR 100'
            'imdb_index': 'CHAR 3'
            'name_pcode_cf': 'CHAR 5'
            'name_pcode_nf': 'CHAR 5'
            'surname_pcode': 'CHAR 5'
            'md5sum': 'CHAR 32'
    'cast_info':
        file: 'benchmark/job/data/cast_info.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':             'INT NOT NULL PRIMARY KEY'
            'person_id':      'INT NOT NULL'
            'movie_id':       'INT NOT NULL'
            'person_role_id': 'INT'
            'note':           'CHAR 100'
            'nr_order':       'INT'
            'role_id':        'INT NOT NULL'
        indexes:
            'id_cast_info':
                attributes: 'id'
            'person_id_cast_info':
                attributes: 'person_id'
            'movie_id_cast_info':
                attributes: 'movie_id'
            'person_role_id_cast_info':
                attributes: 'person_role_id'
            'note_cast_info':
                attributes: 'note'
            'nr_order_cast_info':
                attributes: 'nr_order'
            'role_id_cast_info':
                attributes: 'role_id'
    'company_name':
        file: 'benchmark/job/data/company_name.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':            'INT NOT NULL PRIMARY KEY'
            'name':          'CHAR 100 NOT NULL'
            'country_code':  'CHAR 6'
            'imdb_id':       'INT'
            'name_pcode_nf': 'CHAR 5'
            'name_pcode_sf': 'CHAR 5'
            'md5sum':        'CHAR 32'
        indexes:
            'id_company_name':
                attributes: 'id'
            'name_company_name':
                attributes: 'name'
            'country_code_company_name':
                attributes: 'country_code'
            'imdb_id_company_name':
                attributes: 'imdb_id'
            'name_pcode_nf_company_name':
                attributes: 'name_pcode_nf'
            'name_pcode_sf_company_name':
                attributes: 'name_pcode_sf'
            'md5sum_company_name':
                attributes: 'md5sum'
    'movie_companies':
        file: 'benchmark/job/data/movie_companies.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':              'INT NOT NULL PRIMARY KEY'
            'movie_id':        'INT NOT NULL'
            'company_id':      'INT NOT NULL'
            'company_type_id': 'INT NOT NULL'
            'note':            'CHAR 100'
        indexes:
            'id_movie_companies':
                attributes: 'id'
            'movie_id_movie_companies':
                attributes: 'movie_id'
            'company_id_movie_companies':
                attributes: 'company_id'
            'company_type_id_movie_companies':
                attributes: 'company_type_id'
            'note_movie_companies':
                attributes: 'note'
systems:
    mutable:
        args: >-
            --backend WasmV8
            --cardinality-estimator Injected
            --use-cardinality-file benchmark/holistic-optimization/job-sortedness_q8d.json
        configurations:
            'split (DPccp)':
                args: --optimizer-split --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'split (PEall)':
                args: --optimizer-split --plan-enumerator PEall
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'holistic (DPccp)':
                args: --optimizer-holistic --plan-enumerator DPccp
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'holistic (PEall)':
                args: --optimizer-holistic --plan-enumerator PEall
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
        cases:
            dummy: >-
                SELECT an.name, t.title
                FROM
                    name AS n,
                    cast_info AS ci,
                    company_name AS cn,
                    movie_companies AS mc,
                    role_type AS rt,
                    aka_name AS an,
                    title AS t
                WHERE
                    cn.country_code = "[us]" AND
                    rt.role = "costume designer" AND
                    n.id = ci.person_id AND
                    an.person_id = n.id AND
                    an.person_id = ci.person_id AND
                    t.id = mc.movie_id AND
                    ci.role_id = rt.id AND
                    ci.movie_id = t.id AND
                    ci.movie_id = mc.movie_id AND
                    mc.company_id = cn.id;
