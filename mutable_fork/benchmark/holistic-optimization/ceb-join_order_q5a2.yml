description: IMDb benchmark exploiting different join order. CEB Q5a2.
suite: holistic-optimization
benchmark: ceb
name: join order (q5a2)
readonly: true
data:
    'title':
        file: 'benchmark/job/data/title.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':              'INT NOT NULL PRIMARY KEY'
            'title':           'CHAR 100 NOT NULL'
            'imdb_index':      'CHAR 5'
            'kind_id':         'INT NOT NULL'
            'production_year': 'INT'
            'imdb_id':         'INT'
            'phonetic_code':   'CHAR 5'
            'episode_of_id':   'INT'
            'season_nr':       'INT'
            'episode_nr':      'INT'
            'series_years':    'CHAR 49'
            'md5sum':          'CHAR 32'
        indexes:
            'id_title':
                attributes: 'id'
            'title_title':
                attributes: 'title'
            'imdb_index_title':
                attributes: 'imdb_index'
            'kind_id_title':
                attributes: 'kind_id'
            'production_year_title':
                attributes: 'production_year'
            'imdb_id_title':
                attributes: 'imdb_id'
            'phonetic_code_title':
                attributes: 'phonetic_code'
            'episode_of_id_title':
                attributes: 'episode_of_id'
            'season_nr_title':
                attributes: 'season_nr'
            'episode_nr_title':
                attributes: 'episode_nr'
            'series_years_title':
                attributes: 'series_years'
            'md5sum_title':
                attributes: 'md5sum'
    'kind_type':
        file: 'benchmark/job/data/kind_type.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':   'INT NOT NULL PRIMARY KEY'
            'kind': 'CHAR 15'
        indexes:
            'id_kind_type':
                attributes: 'id'
            'kind_kind_type':
                attributes: 'kind'
    'keyword':
        file: 'benchmark/job/data/keyword.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':            'INT NOT NULL PRIMARY KEY'
            'keyword':       'CHAR 100 NOT NULL'
            'phonetic_code': 'CHAR 5'
        indexes:
            'id_keyword':
                attributes: 'id'
            'keyword_keyword':
                attributes: 'keyword'
            'phonetic_code_keyword':
                attributes: 'phonetic_code'
    'movie_keyword':
        file: 'benchmark/job/data/movie_keyword.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':         'INT NOT NULL PRIMARY KEY'
            'movie_id':   'INT NOT NULL'
            'keyword_id': 'INT NOT NULL'
        indexes:
            'id_movie_keyword':
                attributes: 'id'
            'movie_id_movie_keyword':
                attributes: 'movie_id'
            'keyword_id_movie_keyword':
                attributes: 'keyword_id'
    'info_type':
        file: 'benchmark/job/data/info_type.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':   'INT NOT NULL PRIMARY KEY'
            'info': 'CHAR 32 NOT NULL'
        indexes:
            'id_info_type':
                attributes: 'id'
            'info_info_type':
                attributes: 'info'
    'movie_info':
        file: 'benchmark/job/data/movie_info.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':           'INT NOT NULL PRIMARY KEY'
            'movie_id':     'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info':         'CHAR 100 NOT NULL'
            'note':         'CHAR 100'
        indexes:
            'id_movie_info':
                attributes: 'id'
            'movie_id_movie_info':
                attributes: 'movie_id'
            'info_type_id_movie_info':
                attributes: 'info_type_id'
            'info_movie_info':
                attributes: 'info'
            'note_movie_info':
                attributes: 'note'
    'movie_info_idx':
        file: 'benchmark/job/data/movie_info_idx.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':           'INT NOT NULL PRIMARY KEY'
            'movie_id':     'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info':         'CHAR 100 NOT NULL'
            'note':         'CHAR 1'
        indexes:
            'id_movie_info_idx':
                attributes: 'id'
            'movie_id_movie_info_idx':
                attributes: 'movie_id'
            'info_type_id_movie_info_idx':
                attributes: 'info_type_id'
            'info_movie_info_idx':
                attributes: 'info'
            'note_movie_info_idx':
                attributes: 'note'
systems:
    mutable:
        args: >-
            --backend WasmV8
            --cardinality-estimator Injected
            --use-cardinality-file benchmark/holistic-optimization/ceb-join_order_q5a2.json
        configurations:
            'split (DPccp)':
                args: --optimizer-split --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'split (PEall)':
                args: --optimizer-split --plan-enumerator PEall
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'holistic (DPccp)':
                args: --optimizer-holistic --plan-enumerator DPccp
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'holistic (PEall)':
                args: --optimizer-holistic --plan-enumerator PEall
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
        cases:
            dummy: >-
                SELECT 1
                FROM
                    movie_info_idx AS mii1,
                    info_type AS it2,
                    info_type AS it3,
                    movie_info AS mi,
                    movie_info_idx AS mii2,
                    info_type AS it1,
                    title AS t,
                    kind_type AS kt,
                    keyword AS k,
                    movie_keyword AS mk
                WHERE
                    it2.id = 100 AND
                    it3.id = 101 AND
                    (it1.id = 18 OR it1.id = 5) AND
                    t.production_year <= 1975 AND
                    t.production_year >= 1925 AND
                    (kt.kind = "episode" OR kt.kind = "movie") AND
                    mk.keyword_id = k.id AND
                    mi.info_type_id = it1.id AND
                    t.id = mi.movie_id AND
                    mii1.info_type_id = it2.id AND
                    mii2.info_type_id = it3.id AND
                    t.kind_id = kt.id AND
                    t.id = mii2.movie_id AND
                    t.id = mii1.movie_id AND
                    mi.movie_id = mii1.movie_id AND
                    t.id = mk.movie_id AND
                    mii1.movie_id = mii2.movie_id AND
                    mk.movie_id = mi.movie_id;
