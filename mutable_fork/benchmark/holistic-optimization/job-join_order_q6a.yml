description: IMDb benchmark exploiting different join order. JOB Q6a.
suite: holistic-optimization
benchmark: job
name: join order (q6a)
readonly: true
data:
    'title':
        file: 'benchmark/job/data/title.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':              'INT NOT NULL PRIMARY KEY'
            'title':           'CHAR 100 NOT NULL'
            'imdb_index':      'CHAR 5'
            'kind_id':         'INT NOT NULL'
            'production_year': 'INT'
            'imdb_id':         'INT'
            'phonetic_code':   'CHAR 5'
            'episode_of_id':   'INT'
            'season_nr':       'INT'
            'episode_nr':      'INT'
            'series_years':    'CHAR 49'
            'md5sum':          'CHAR 32'
        indexes:
            'id_title':
                attributes: 'id'
            'title_title':
                attributes: 'title'
            'imdb_index_title':
                attributes: 'imdb_index'
            'kind_id_title':
                attributes: 'kind_id'
            'production_year_title':
                attributes: 'production_year'
            'imdb_id_title':
                attributes: 'imdb_id'
            'phonetic_code_title':
                attributes: 'phonetic_code'
            'episode_of_id_title':
                attributes: 'episode_of_id'
            'season_nr_title':
                attributes: 'season_nr'
            'episode_nr_title':
                attributes: 'episode_nr'
            'series_years_title':
                attributes: 'series_years'
            'md5sum_title':
                attributes: 'md5sum'
    'movie_keyword':
        file: 'benchmark/job/data/movie_keyword.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':         'INT NOT NULL PRIMARY KEY'
            'movie_id':   'INT NOT NULL'
            'keyword_id': 'INT NOT NULL'
        indexes:
            'id_movie_keyword':
                attributes: 'id'
            'movie_id_movie_keyword':
                attributes: 'movie_id'
            'keyword_id_movie_keyword':
                attributes: 'keyword_id'
    'keyword':
        file: 'benchmark/job/data/keyword.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':            'INT NOT NULL PRIMARY KEY'
            'keyword':       'CHAR 100 NOT NULL'
            'phonetic_code': 'CHAR 5'
        indexes:
            'id_keyword':
                attributes: 'id'
            'keyword_keyword':
                attributes: 'keyword'
            'phonetic_code_keyword':
                attributes: 'phonetic_code'
    'cast_info':
        file: 'benchmark/job/data/cast_info.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':             'INT NOT NULL PRIMARY KEY'
            'person_id':      'INT NOT NULL'
            'movie_id':       'INT NOT NULL'
            'person_role_id': 'INT'
            'note':           'CHAR 100'
            'nr_order':       'INT'
            'role_id':        'INT NOT NULL'
        indexes:
            'id_cast_info':
                attributes: 'id'
            'person_id_cast_info':
                attributes: 'person_id'
            'movie_id_cast_info':
                attributes: 'movie_id'
            'person_role_id_cast_info':
                attributes: 'person_role_id'
            'note_cast_info':
                attributes: 'note'
            'nr_order_cast_info':
                attributes: 'nr_order'
            'role_id_cast_info':
                attributes: 'role_id'
    'name':
        file: 'benchmark/job/data/name.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':            'INT NOT NULL PRIMARY KEY'
            'name':          'CHAR 100 NOT NULL'
            'imdb_index':    'CHAR 9'
            'imdb_id':       'INT'
            'gender':        'CHAR 1'
            'name_pcode_cf': 'CHAR 5'
            'name_pcode_nf': 'CHAR 5'
            'surname_pcode': 'CHAR 5'
            'md5sum':        'CHAR 32'
        indexes:
            'id_name':
                attributes: 'id'
            'name_name':
                attributes: 'name'
            'imdb_index_name':
                attributes: 'imdb_index'
            'imdb_id_name':
                attributes: 'imdb_id'
            'gender_name':
                attributes: 'gender'
            'name_pcode_cf_name':
                attributes: 'name_pcode_cf'
            'name_pcode_nf_name':
                attributes: 'name_pcode_nf'
            'surname_pcode_name':
                attributes: 'surname_pcode'
            'md5sum_name':
                attributes: 'md5sum'
systems:
    mutable:
        args: >-
            --backend WasmV8
            --cardinality-estimator Injected
            --use-cardinality-file benchmark/holistic-optimization/job-join_order_q6a.json
        configurations:
            'split (DPccp)':
                args: --optimizer-split --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'split (PEall)':
                args: --optimizer-split --plan-enumerator PEall
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'holistic (DPccp)':
                args: --optimizer-holistic --plan-enumerator DPccp
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'holistic (PEall)':
                args: --optimizer-holistic --plan-enumerator PEall
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
        cases:
            dummy: >-
                SELECT t.title, k.keyword, n.name
                FROM
                    title AS t,
                    keyword AS k,
                    movie_keyword AS mk,
                    name AS n,
                    cast_info AS ci
                WHERE
                    t.production_year > 2010 AND
                    k.keyword = "marvel-cinematic-universe" AND
                    n.name LIKE "%Downey%Robert%" AND
                    k.id = mk.keyword_id AND
                    t.id = ci.movie_id AND
                    n.id = ci.person_id AND
                    ci.movie_id = mk.movie_id AND
                    t.id = mk.movie_id;
