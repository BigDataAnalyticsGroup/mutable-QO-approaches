description: IMDb benchmark exploiting different join order. CEB Q6a7.
suite: holistic-optimization
benchmark: ceb
name: join order (q6a7)
readonly: true
data:
    'cast_info':
        file: 'benchmark/job/data/cast_info.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':             'INT NOT NULL PRIMARY KEY'
            'person_id':      'INT NOT NULL'
            'movie_id':       'INT NOT NULL'
            'person_role_id': 'INT'
            'note':           'CHAR 100'
            'nr_order':       'INT'
            'role_id':        'INT NOT NULL'
        indexes:
            'id_cast_info':
                attributes: 'id'
            'person_id_cast_info':
                attributes: 'person_id'
            'movie_id_cast_info':
                attributes: 'movie_id'
            'person_role_id_cast_info':
                attributes: 'person_role_id'
            'note_cast_info':
                attributes: 'note'
            'nr_order_cast_info':
                attributes: 'nr_order'
            'role_id_cast_info':
                attributes: 'role_id'
    'name':
        file: 'benchmark/job/data/name.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':            'INT NOT NULL PRIMARY KEY'
            'name':          'CHAR 100 NOT NULL'
            'imdb_index':    'CHAR 9'
            'imdb_id':       'INT'
            'gender':        'CHAR 1'
            'name_pcode_cf': 'CHAR 5'
            'name_pcode_nf': 'CHAR 5'
            'surname_pcode': 'CHAR 5'
            'md5sum':        'CHAR 32'
        indexes:
            'id_name':
                attributes: 'id'
            'name_name':
                attributes: 'name'
            'imdb_index_name':
                attributes: 'imdb_index'
            'imdb_id_name':
                attributes: 'imdb_id'
            'gender_name':
                attributes: 'gender'
            'name_pcode_cf_name':
                attributes: 'name_pcode_cf'
            'name_pcode_nf_name':
                attributes: 'name_pcode_nf'
            'surname_pcode_name':
                attributes: 'surname_pcode'
            'md5sum_name':
                attributes: 'md5sum'
    'title':
        file: 'benchmark/job/data/title.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':              'INT NOT NULL PRIMARY KEY'
            'title':           'CHAR 100 NOT NULL'
            'imdb_index':      'CHAR 5'
            'kind_id':         'INT NOT NULL'
            'production_year': 'INT'
            'imdb_id':         'INT'
            'phonetic_code':   'CHAR 5'
            'episode_of_id':   'INT'
            'season_nr':       'INT'
            'episode_nr':      'INT'
            'series_years':    'CHAR 49'
            'md5sum':          'CHAR 32'
        indexes:
            'id_title':
                attributes: 'id'
            'title_title':
                attributes: 'title'
            'imdb_index_title':
                attributes: 'imdb_index'
            'kind_id_title':
                attributes: 'kind_id'
            'production_year_title':
                attributes: 'production_year'
            'imdb_id_title':
                attributes: 'imdb_id'
            'phonetic_code_title':
                attributes: 'phonetic_code'
            'episode_of_id_title':
                attributes: 'episode_of_id'
            'season_nr_title':
                attributes: 'season_nr'
            'episode_nr_title':
                attributes: 'episode_nr'
            'series_years_title':
                attributes: 'series_years'
            'md5sum_title':
                attributes: 'md5sum'
    'role_type':
        file: 'benchmark/job/data/role_type.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':   'INT NOT NULL PRIMARY KEY'
            'role': 'CHAR 32 NOT NULL'
        indexes:
            'id_role_type':
                attributes: 'id'
            'role_role_type':
                attributes: 'role'
    'kind_type':
        file: 'benchmark/job/data/kind_type.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':   'INT NOT NULL PRIMARY KEY'
            'kind': 'CHAR 15'
        indexes:
            'id_kind_type':
                attributes: 'id'
            'kind_kind_type':
                attributes: 'kind'
    'info_type':
        file: 'benchmark/job/data/info_type.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':   'INT NOT NULL PRIMARY KEY'
            'info': 'CHAR 32 NOT NULL'
        indexes:
            'id_info_type':
                attributes: 'id'
            'info_info_type':
                attributes: 'info'
    'movie_info':
        file: 'benchmark/job/data/movie_info.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':           'INT NOT NULL PRIMARY KEY'
            'movie_id':     'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info':         'CHAR 100 NOT NULL'
            'note':         'CHAR 100'
        indexes:
            'id_movie_info':
                attributes: 'id'
            'movie_id_movie_info':
                attributes: 'movie_id'
            'info_type_id_movie_info':
                attributes: 'info_type_id'
            'info_movie_info':
                attributes: 'info'
            'note_movie_info':
                attributes: 'note'
    'movie_info_idx':
        file: 'benchmark/job/data/movie_info_idx.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':           'INT NOT NULL PRIMARY KEY'
            'movie_id':     'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info':         'CHAR 100 NOT NULL'
            'note':         'CHAR 1'
        indexes:
            'id_movie_info_idx':
                attributes: 'id'
            'movie_id_movie_info_idx':
                attributes: 'movie_id'
            'info_type_id_movie_info_idx':
                attributes: 'info_type_id'
            'info_movie_info_idx':
                attributes: 'info'
            'note_movie_info_idx':
                attributes: 'note'
    'person_info':
        file: 'benchmark/job/data/person_info.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':           'INT NOT NULL PRIMARY KEY'
            'person_id':    'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info':         'CHAR 100 NOT NULL'
            'note':         'CHAR 100'
        indexes:
            'id_person_info':
                attributes: 'id'
            'person_id_person_info':
                attributes: 'person_id'
            'info_type_id_person_info':
                attributes: 'info_type_id'
            'info_person_info':
                attributes: 'info'
            'note_person_info':
                attributes: 'note'
    'aka_name':
        file: 'benchmark/job/data/aka_name.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL PRIMARY KEY'
            'person_id': 'INT NOT NULL'
            'name': 'CHAR 100'
            'imdb_index': 'CHAR 3'
            'name_pcode_cf': 'CHAR 5'
            'name_pcode_nf': 'CHAR 5'
            'surname_pcode': 'CHAR 5'
            'md5sum': 'CHAR 32'
        indexes:
            'id_aka_name':
                attributes: 'id'
            'person_id_aka_name':
                attributes: 'person_id'
            'name_aka_name':
                attributes: 'name'
            'imdb_index_aka_name':
                attributes: 'imdb_index'
            'name_pcode_cf_aka_name':
                attributes: 'name_pcode_cf'
            'name_pcode_nf_aka_name':
                attributes: 'name_pcode_nf'
            'surname_pcode_aka_name':
                attributes: 'surname_pcode'
            'md5sum_aka_name':
                attributes: 'md5sum'
systems:
    mutable:
        args: >-
            --backend WasmV8
            --cardinality-estimator Injected
            --use-cardinality-file benchmark/holistic-optimization/ceb-join_order_q6a7.json
        configurations:
            'split (DPccp)':
                args: --optimizer-split --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'split (PEall)':
                args: --optimizer-split --plan-enumerator PEall
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'holistic (DPccp)':
                args: --optimizer-holistic --plan-enumerator DPccp
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'holistic (PEall)':
                args: --optimizer-holistic --plan-enumerator PEall
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
        cases:
            dummy: >-
                SELECT n.name
                FROM
                    person_info AS pi,
                    cast_info AS ci,
                    role_type AS rt,
                    movie_info AS mi,
                    info_type AS it2,
                    info_type AS it3,
                    info_type AS it4,
                    movie_info_idx AS mii1,
                    info_type AS it1,
                    movie_info_idx AS mii2,
                    title AS t,
                    kind_type AS kt,
                    aka_name AS an,
                    name AS n
                WHERE
                    (ci.note = "(producer)" OR ci.note = "(voice)" OR ISNULL(ci.note)) AND
                    (rt.role = "actress" OR rt.role = "producer") AND
                    it2.id = 100 AND
                    it3.id = 101 AND
                    it4.id = 25 AND
                    (it1.id = 13 OR it1.id = 4) AND
                    t.production_year <= 2015 AND
                    t.production_year >= 1925 AND
                    (kt.kind = "episode" OR kt.kind = "movie") AND
                    n.gender = "f" AND
                    (n.name_pcode_nf = "D5142" OR n.name_pcode_nf = "D52" OR n.name_pcode_nf = "E5252" OR n.name_pcode_nf = "J2152" OR n.name_pcode_nf = "J4524" OR n.name_pcode_nf = "K32" OR n.name_pcode_nf = "K452" OR n.name_pcode_nf = "L6526" OR n.name_pcode_nf = "M4252" OR n.name_pcode_nf = "M6215" OR n.name_pcode_nf = "M6325" OR n.name_pcode_nf = "M6515" OR n.name_pcode_nf = "N5252") AND
                    pi.person_id = ci.person_id AND
                    pi.person_id = an.person_id AND
                    mi.info_type_id = it1.id AND
                    t.id = mi.movie_id AND
                    mii1.info_type_id = it2.id AND
                    mii2.info_type_id = it3.id AND
                    t.kind_id = kt.id AND
                    n.id = ci.person_id AND
                    rt.id = ci.role_id AND
                    t.id = mii2.movie_id AND
                    t.id = mii1.movie_id AND
                    mi.movie_id = mii1.movie_id AND
                    t.id = ci.movie_id AND
                    ci.person_id = an.person_id AND
                    n.id = pi.person_id AND
                    n.id = an.person_id AND
                    it4.id = pi.info_type_id AND
                    mii1.movie_id = mii2.movie_id;
