                      C.aid = A.id AND C.bid = B.id AND C.did = D.id AND C.eid = E.id AND C.fid = F.id AND
                      D.aid = A.id AND D.bid = B.id AND D.cid = C.id AND D.eid = E.id AND D.fid = F.id AND
                      E.aid = A.id AND E.bid = B.id AND E.cid = C.id AND E.did = D.id AND E.fid = F.id AND
                      F.aid = A.id AND F.bid = B.id AND F.cid = C.id AND F.did = D.id AND F.eid = E.id;
            7: >-
