systems:
    mutable:
        args: --backend WasmV8 --dryrun
        configurations:
            'split (DPccp)':
                args: --optimizer-split --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
            'split (PEall)':
                args: --optimizer-split --plan-enumerator PEall
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
            'top-2 (DPccp)':
                args: --optimizer-topk 2 --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the top-k logical query plans:.*'
                    Optimization Time (physical): '^Compute the top-k physical query plans:.*'
            'top-2 (PEall)':
                args: --optimizer-topk 2 --plan-enumerator PEall
                pattern:
                    Optimization Time (algebraic): '^Compute the top-k logical query plans:.*'
                    Optimization Time (physical): '^Compute the top-k physical query plans:.*'
            'top-5 (DPccp)':
                args: --optimizer-topk 5 --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the top-k logical query plans:.*'
                    Optimization Time (physical): '^Compute the top-k physical query plans:.*'
            'top-5 (PEall)':
                args: --optimizer-topk 5 --plan-enumerator PEall
                pattern:
                    Optimization Time (algebraic): '^Compute the top-k logical query plans:.*'
                    Optimization Time (physical): '^Compute the top-k physical query plans:.*'
            'top-10 (DPccp)':
                args: --optimizer-topk 10 --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the top-k logical query plans:.*'
                    Optimization Time (physical): '^Compute the top-k physical query plans:.*'
            'top-10 (PEall)':
                args: --optimizer-topk 10 --plan-enumerator PEall
                pattern:
                    Optimization Time (algebraic): '^Compute the top-k logical query plans:.*'
                    Optimization Time (physical): '^Compute the top-k physical query plans:.*'
            'holistic (DPccp)':
                args: --optimizer-holistic --plan-enumerator DPccp
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
            'holistic (PEall)':
                args: --optimizer-holistic --plan-enumerator PEall
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
        cases:
            2: >-
                SELECT 1
                FROM A, B
                WHERE A.bid = B.id AND
                      B.aid = A.id;
            3: >-
                SELECT 1
                FROM A, B, C
                WHERE A.bid = B.id AND A.cid = C.id AND
                      B.aid = A.id AND B.cid = C.id AND
                      C.aid = A.id AND C.bid = B.id;
            4: >-
                SELECT 1
                FROM A, B, C, D
                WHERE A.bid = B.id AND A.cid = C.id AND A.did = D.id AND
                      B.aid = A.id AND B.cid = C.id AND B.did = D.id AND
                      C.aid = A.id AND C.bid = B.id AND C.did = D.id AND
                      D.aid = A.id AND D.bid = B.id AND D.cid = C.id;
            5: >-
                SELECT 1
                FROM A, B, C, D, E
                WHERE A.bid = B.id AND A.cid = C.id AND A.did = D.id AND A.eid = E.id AND
                      B.aid = A.id AND B.cid = C.id AND B.did = D.id AND B.eid = E.id AND
                      C.aid = A.id AND C.bid = B.id AND C.did = D.id AND C.eid = E.id AND
                      D.aid = A.id AND D.bid = B.id AND D.cid = C.id AND D.eid = E.id AND
                      E.aid = A.id AND E.bid = B.id AND E.cid = C.id AND E.did = D.id;
            6: >-
