systems:
    mutable:
        args: >-
            --backend WasmV8
            --cardinality-estimator Injected
            --use-cardinality-file benchmark/holistic-optimization/job-join_order_q29a.json
        configurations:
            'split (DPccp)':
                args: --optimizer-split --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
            'top-5 (DPccp)':
                args: --optimizer-topk 5 --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the top-k logical query plans:.*'
                    Optimization Time (physical): '^Compute the top-k physical query plans:.*'
                    Execution Time: '^Execute query:.*'
            'top-10 (DPccp)':
                args: --optimizer-topk 10 --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the top-k logical query plans:.*'
                    Optimization Time (physical): '^Compute the top-k physical query plans:.*'
                    Execution Time: '^Execute query:.*'
            'holistic with pruning (DPccp)':
                args: --optimizer-holistic --enable-initialized-cost-based-pruning --plan-enumerator DPccp
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
            'holistic (DPccp)':
                args: --optimizer-holistic --plan-enumerator DPccp
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
#            'auto':
#                args: --dryrun
#                pattern:
#                    dummy: '^.*:.*'
        cases:
            dummy: >-
                SELECT n.name, t.title, chn.name
                FROM
                    movie_companies AS mc,
                    movie_info AS mi,
                    movie_keyword AS mk,
                    name AS n,
                    person_info AS pi,
                    role_type AS rt,
                    title AS t,
                    char_name AS chn,
                    aka_name AS an,
                    complete_cast AS cc,
                    comp_cast_type AS cct1,
                    cast_info AS ci,
                    comp_cast_type AS cct2,
                    company_name AS cn,
                    info_type AS it1,
                    info_type AS it2,
                    keyword AS k
                WHERE
                    NOT ISNULL(mi.info) AND
                    (mi.info LIKE "Japan:%200%" OR mi.info LIKE "USA:%200%") AND
                    n.gender = "f" AND
                    n.name LIKE "%An%" AND
                    rt.role = "actress" AND
                    t.title = "Shrek 2" AND
                    t.production_year >= 2000 AND
                    t.production_year <= 2010 AND
                    chn.name = "Queen" AND
                    cct1.kind = "cast" AND
                    (ci.note = "(voice)" OR ci.note = "(voice) (uncredited)" OR ci.note = "(voice: English version)") AND
                    cct2.kind = "complete+verified" AND
                    cn.country_code = "[us]" AND
                    it1.info = "release dates" AND
                    it2.info = "trivia" AND
                    k.keyword = "computer-animation" AND
                    mc.movie_id = cc.movie_id AND
                    ci.movie_id = cc.movie_id AND
                    mc.movie_id = mk.movie_id AND
                    cn.id = mc.company_id AND
                    it1.id = mi.info_type_id AND
                    k.id = mk.keyword_id AND
                    mi.movie_id = cc.movie_id AND
                    mi.movie_id = ci.movie_id AND
                    n.id = ci.person_id AND
                    chn.id = ci.person_role_id AND
                    cct1.id = cc.subject_id AND
                    cct2.id = cc.status_id AND
                    mi.movie_id = t.kind_id AND
                    n.id = pi.person_id AND
                    ci.person_id = an.person_id AND
                    mc.movie_id = t.id AND
                    rt.id = ci.role_id AND
                    mc.movie_id = mi.movie_id AND
                    mc.movie_id = ci.movie_id AND
                    ci.person_id = pi.person_id AND
                    cc.movie_id = t.id AND
                    mk.movie_id = cc.movie_id AND
                    it2.id = pi.info_type_id AND
                    ci.movie_id = t.id AND
                    n.id = an.person_id AND
                    mi.movie_id = mk.movie_id AND
                    ci.movie_id = mk.movie_id AND
                    mk.movie_id = t.id;
