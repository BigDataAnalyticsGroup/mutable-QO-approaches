description: IMDb benchmark exploiting sortedness. JOB Q26a.
suite: holistic-optimization
benchmark: job
name: sortedness (q26a)
readonly: true
data:
    'movie_keyword':
        file: 'benchmark/job/data/movie_keyword.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':         'INT NOT NULL PRIMARY KEY'
            'movie_id':   'INT NOT NULL'
            'keyword_id': 'INT NOT NULL'
        indexes:
            'id_movie_keyword':
                attributes: 'id'
            'movie_id_movie_keyword':
                attributes: 'movie_id'
            'keyword_id_movie_keyword':
                attributes: 'keyword_id'
    'title':
        file: 'benchmark/job/data/title.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':              'INT NOT NULL PRIMARY KEY'
            'title':           'CHAR 100 NOT NULL'
            'imdb_index':      'CHAR 5'
            'kind_id':         'INT NOT NULL'
            'production_year': 'INT'
            'imdb_id':         'INT'
            'phonetic_code':   'CHAR 5'
            'episode_of_id':   'INT'
            'season_nr':       'INT'
            'episode_nr':      'INT'
            'series_years':    'CHAR 49'
            'md5sum':          'CHAR 32'
        indexes:
            'id_title':
                attributes: 'id'
            'title_title':
                attributes: 'title'
            'imdb_index_title':
                attributes: 'imdb_index'
            'kind_id_title':
                attributes: 'kind_id'
            'production_year_title':
                attributes: 'production_year'
            'imdb_id_title':
                attributes: 'imdb_id'
            'phonetic_code_title':
                attributes: 'phonetic_code'
            'episode_of_id_title':
                attributes: 'episode_of_id'
            'season_nr_title':
                attributes: 'season_nr'
            'episode_nr_title':
                attributes: 'episode_nr'
            'series_years_title':
                attributes: 'series_years'
            'md5sum_title':
                attributes: 'md5sum'
    'keyword':
        file: 'benchmark/job/data/keyword.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':            'INT NOT NULL PRIMARY KEY'
            'keyword':       'CHAR 100 NOT NULL'
            'phonetic_code': 'CHAR 5'
        indexes:
            'id_keyword':
                attributes: 'id'
            'keyword_keyword':
                attributes: 'keyword'
            'phonetic_code_keyword':
                attributes: 'phonetic_code'
    'comp_cast_type':
        file: 'benchmark/job/data/comp_cast_type.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':   'INT NOT NULL PRIMARY KEY'
            'kind': 'CHAR 32 NOT NULL'
        indexes:
            'id_comp_cast_type':
                attributes: 'id'
            'kind_comp_cast_type':
                attributes: 'kind'
    'complete_cast':
        file: 'benchmark/job/data/complete_cast.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':         'INT NOT NULL PRIMARY KEY'
            'movie_id':   'INT'
            'subject_id': 'INT NOT NULL'
            'status_id':  'INT NOT NULL'
        indexes:
            'id_complete_cast':
                attributes: 'id'
            'movie_id_complete_cast':
                attributes: 'movie_id'
            'subject_id_complete_cast':
                attributes: 'subject_id'
            'status_id_complete_cast':
                attributes: 'status_id'
    'cast_info':
        file: 'benchmark/job/data/cast_info.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':             'INT NOT NULL PRIMARY KEY'
            'person_id':      'INT NOT NULL'
            'movie_id':       'INT NOT NULL'
            'person_role_id': 'INT'
            'note':           'CHAR 100'
            'nr_order':       'INT'
            'role_id':        'INT NOT NULL'
        indexes:
            'id_cast_info':
                attributes: 'id'
            'person_id_cast_info':
                attributes: 'person_id'
            'movie_id_cast_info':
                attributes: 'movie_id'
            'person_role_id_cast_info':
                attributes: 'person_role_id'
            'note_cast_info':
                attributes: 'note'
            'nr_order_cast_info':
                attributes: 'nr_order'
            'role_id_cast_info':
                attributes: 'role_id'
    'name':
        file: 'benchmark/job/data/name.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':            'INT NOT NULL PRIMARY KEY'
            'name':          'CHAR 100 NOT NULL'
            'imdb_index':    'CHAR 9'
            'imdb_id':       'INT'
            'gender':        'CHAR 1'
            'name_pcode_cf': 'CHAR 5'
            'name_pcode_nf': 'CHAR 5'
            'surname_pcode': 'CHAR 5'
            'md5sum':        'CHAR 32'
        indexes:
            'id_name':
                attributes: 'id'
            'name_name':
                attributes: 'name'
            'imdb_index_name':
                attributes: 'imdb_index'
            'imdb_id_name':
                attributes: 'imdb_id'
            'gender_name':
                attributes: 'gender'
            'name_pcode_cf_name':
                attributes: 'name_pcode_cf'
            'name_pcode_nf_name':
                attributes: 'name_pcode_nf'
            'surname_pcode_name':
                attributes: 'surname_pcode'
            'md5sum_name':
                attributes: 'md5sum'
    'info_type':
        file: 'benchmark/job/data/info_type.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':   'INT NOT NULL PRIMARY KEY'
            'info': 'CHAR 32 NOT NULL'
        indexes:
            'id_info_type':
                attributes: 'id'
            'info_info_type':
                attributes: 'info'
    'char_name':
        file: 'benchmark/job/data/char_name.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':            'INT NOT NULL PRIMARY KEY'
            'name':          'CHAR 100 NOT NULL'
            'imdb_index':    'CHAR 2'
            'imdb_id':       'INT'
            'name_pcode_nf': 'CHAR 5'
            'surname_pcode': 'CHAR 5'
            'md5sum':        'CHAR 32'
        indexes:
            'id_char_name':
                attributes: 'id'
            'name_char_name':
                attributes: 'name'
            'imdb_index_char_name':
                attributes: 'imdb_index'
            'imdb_id_char_name':
                attributes: 'imdb_id'
            'name_pcode_nf_char_name':
                attributes: 'name_pcode_nf'
            'surname_pcode_char_name':
                attributes: 'surname_pcode'
            'md5sum_char_name':
                attributes: 'md5sum'
    'kind_type':
        file: 'benchmark/job/data/kind_type.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':   'INT NOT NULL PRIMARY KEY'
            'kind': 'CHAR 15'
        indexes:
            'id_kind_type':
                attributes: 'id'
            'kind_kind_type':
                attributes: 'kind'
    'movie_info_idx':
        file: 'benchmark/job/data/movie_info_idx.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':           'INT NOT NULL PRIMARY KEY'
            'movie_id':     'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info':         'CHAR 100 NOT NULL'
            'note':         'CHAR 1'
        indexes:
            'id_movie_info_idx':
                attributes: 'id'
            'movie_id_movie_info_idx':
                attributes: 'movie_id'
            'info_type_id_movie_info_idx':
                attributes: 'info_type_id'
            'info_movie_info_idx':
                attributes: 'info'
            'note_movie_info_idx':
                attributes: 'note'
systems:
    mutable:
        args: >-
            --backend WasmV8
            --cardinality-estimator Injected
            --use-cardinality-file benchmark/holistic-optimization/job-sortedness_q26a.json
        configurations:
            'split (DPccp)':
                args: --optimizer-split --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'split (PEall)':
                args: --optimizer-split --plan-enumerator PEall
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'holistic (DPccp)':
                args: --optimizer-holistic --plan-enumerator DPccp
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'holistic (PEall)':
                args: --optimizer-holistic --plan-enumerator PEall
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
        cases:
            dummy: >-
                SELECT n.name, t.title, chn.name, miidx.info
                FROM
                    name AS n,
                    title AS t,
                    complete_cast AS cc,
                    cast_info AS ci,
                    comp_cast_type AS cct1,
                    comp_cast_type AS cct2,
                    info_type AS it,
                    char_name AS chn,
                    keyword AS k,
                    kind_type AS kt,
                    movie_info_idx AS miidx,
                    movie_keyword AS mk
                WHERE
                    t.production_year > 2000 AND
                    cct1.kind = "cast" AND
                    cct2.kind LIKE "%complete%" AND
                    NOT ISNULL(chn.name) AND
                    (chn.name LIKE "%man%" OR chn.name LIKE "%Man%") AND
                    (k.keyword = "superhero" OR k.keyword = "marvel-comics" OR k.keyword = "based-on-comic" OR k.keyword = "tv-special" OR k.keyword = "fight" OR k.keyword = "violence" OR k.keyword = "magnet" OR k.keyword = "web" OR k.keyword = "claw" OR k.keyword = "laser") AND
                    kt.kind = "movie" AND
                    miidx.info > "7.0" AND
                    ci.movie_id = cc.movie_id AND
                    it.id = miidx.info_type_id AND
                    mk.movie_id = miidx.movie_id AND
                    cct1.id = cc.subject_id AND
                    cc.movie_id = t.id AND
                    miidx.movie_id = t.id AND
                    ci.movie_id = t.id AND
                    ci.movie_id = miidx.movie_id AND
                    chn.id = ci.person_role_id AND
                    k.id = mk.keyword_id AND
                    mk.movie_id = cc.movie_id AND
                    cct2.id = cc.status_id AND
                    mk.movie_id = ci.movie_id AND
                    cc.movie_id = miidx.movie_id AND
                    mk.movie_id = t.id AND
                    kt.id = t.kind_id AND
                    n.id = ci.person_id;
