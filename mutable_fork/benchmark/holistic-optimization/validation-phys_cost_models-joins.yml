description: Exhaustive enumeration of join orders to validate physical cost models.
suite: holistic-optimization
benchmark: validation
name: join order
readonly: true
data:
    'S_validation':
        file: 'benchmark/holistic-optimization/data/S_validation.csv'
        format: 'csv'
        delimiter: ','
        header: 1
        attributes:
            'id':  'INT NOT NULL PRIMARY KEY'
            'val': 'INT NOT NULL'
    'R_validation':
        file: 'benchmark/holistic-optimization/data/R_validation.csv'
        format: 'csv'
        delimiter: ','
        header: 1
        attributes:
            'id':  'INT NOT NULL PRIMARY KEY'
            'sid': 'INT NOT NULL REFERENCES S_validation(id)'
            'val': 'INT NOT NULL'
    'U_validation':
        file: 'benchmark/holistic-optimization/data/U_validation.csv'
        format: 'csv'
        delimiter: ','
        header: 1
        attributes:
            'id':  'INT NOT NULL PRIMARY KEY'
            'val': 'INT NOT NULL'
    'T_validation':
        file: 'benchmark/holistic-optimization/data/T_validation.csv'
        format: 'csv'
        delimiter: ','
        header: 1
        attributes:
            'sid': 'INT NOT NULL REFERENCES S_validation(id)'
            'uid': 'INT NOT NULL REFERENCES U_validation(id)'
            'val': 'INT NOT NULL'
systems:
    mutable:
        args: >-
            --backend WasmV8
            --cardinality-estimator Injected
            --use-cardinality-file benchmark/holistic-optimization/validation-phys_cost_models-joins.json
            --xxx-optimizer-exhaustive
            --statistics
        configurations:
            'dummy':
                pattern:
                    Estimated Cost: '^Est. physical plan cost:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
        cases:
            dummy: >-
                SELECT 1
                FROM R_validation AS R, S_validation AS S, T_validation AS T, U_validation AS U
                WHERE R.sid = S.id AND S.id = T.sid AND T.uid = U.id;
