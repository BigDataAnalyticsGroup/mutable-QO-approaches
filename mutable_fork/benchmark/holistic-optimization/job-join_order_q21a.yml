description: IMDb benchmark exploiting different join order. JOB Q21a.
suite: holistic-optimization
benchmark: job
name: join order (q21a)
readonly: true
data:
    'title':
        file: 'benchmark/job/data/title.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':              'INT NOT NULL PRIMARY KEY'
            'title':           'CHAR 100 NOT NULL'
            'imdb_index':      'CHAR 5'
            'kind_id':         'INT NOT NULL'
            'production_year': 'INT'
            'imdb_id':         'INT'
            'phonetic_code':   'CHAR 5'
            'episode_of_id':   'INT'
            'season_nr':       'INT'
            'episode_nr':      'INT'
            'series_years':    'CHAR 49'
            'md5sum':          'CHAR 32'
        indexes:
            'id_title':
                attributes: 'id'
            'title_title':
                attributes: 'title'
            'imdb_index_title':
                attributes: 'imdb_index'
            'kind_id_title':
                attributes: 'kind_id'
            'production_year_title':
                attributes: 'production_year'
            'imdb_id_title':
                attributes: 'imdb_id'
            'phonetic_code_title':
                attributes: 'phonetic_code'
            'episode_of_id_title':
                attributes: 'episode_of_id'
            'season_nr_title':
                attributes: 'season_nr'
            'episode_nr_title':
                attributes: 'episode_nr'
            'series_years_title':
                attributes: 'series_years'
            'md5sum_title':
                attributes: 'md5sum'
    'movie_info':
        file: 'benchmark/job/data/movie_info.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':           'INT NOT NULL PRIMARY KEY'
            'movie_id':     'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info':         'CHAR 100 NOT NULL'
            'note':         'CHAR 100'
        indexes:
            'id_movie_info':
                attributes: 'id'
            'movie_id_movie_info':
                attributes: 'movie_id'
            'info_type_id_movie_info':
                attributes: 'info_type_id'
            'info_movie_info':
                attributes: 'info'
            'note_movie_info':
                attributes: 'note'
    'keyword':
        file: 'benchmark/job/data/keyword.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':            'INT NOT NULL PRIMARY KEY'
            'keyword':       'CHAR 100 NOT NULL'
            'phonetic_code': 'CHAR 5'
        indexes:
            'id_keyword':
                attributes: 'id'
            'keyword_keyword':
                attributes: 'keyword'
            'phonetic_code_keyword':
                attributes: 'phonetic_code'
    'company_name':
        file: 'benchmark/job/data/company_name.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':            'INT NOT NULL PRIMARY KEY'
            'name':          'CHAR 100 NOT NULL'
            'country_code':  'CHAR 6'
            'imdb_id':       'INT'
            'name_pcode_nf': 'CHAR 5'
            'name_pcode_sf': 'CHAR 5'
            'md5sum':        'CHAR 32'
        indexes:
            'id_company_name':
                attributes: 'id'
            'name_company_name':
                attributes: 'name'
            'country_code_company_name':
                attributes: 'country_code'
            'imdb_id_company_name':
                attributes: 'imdb_id'
            'name_pcode_nf_company_name':
                attributes: 'name_pcode_nf'
            'name_pcode_sf_company_name':
                attributes: 'name_pcode_sf'
            'md5sum_company_name':
                attributes: 'md5sum'
    'company_type':
        file: 'benchmark/job/data/company_type.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':   'INT NOT NULL PRIMARY KEY'
            'kind': 'CHAR 32 NOT NULL'
        indexes:
            'id_company_type':
                attributes: 'id'
            'kind_company_type':
                attributes: 'kind'
    'movie_companies':
        file: 'benchmark/job/data/movie_companies.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':              'INT NOT NULL PRIMARY KEY'
            'movie_id':        'INT NOT NULL'
            'company_id':      'INT NOT NULL'
            'company_type_id': 'INT NOT NULL'
            'note':            'CHAR 100'
        indexes:
            'id_movie_companies':
                attributes: 'id'
            'movie_id_movie_companies':
                attributes: 'movie_id'
            'company_id_movie_companies':
                attributes: 'company_id'
            'company_type_id_movie_companies':
                attributes: 'company_type_id'
            'note_movie_companies':
                attributes: 'note'
    'movie_keyword':
        file: 'benchmark/job/data/movie_keyword.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':         'INT NOT NULL PRIMARY KEY'
            'movie_id':   'INT NOT NULL'
            'keyword_id': 'INT NOT NULL'
        indexes:
            'id_movie_keyword':
                attributes: 'id'
            'movie_id_movie_keyword':
                attributes: 'movie_id'
            'keyword_id_movie_keyword':
                attributes: 'keyword_id'
    'movie_link':
        file: 'benchmark/job/data/movie_link.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':              'INT NOT NULL PRIMARY KEY'
            'movie_id':        'INT NOT NULL'
            'linked_movie_id': 'INT NOT NULL'
            'link_type_id':    'INT NOT NULL'
        indexes:
            'id_movie_link':
                attributes: 'id'
            'movie_id_movie_link':
                attributes: 'movie_id'
            'linked_movie_id_movie_link':
                attributes: 'linked_movie_id'
            'link_type_id_movie_link':
                attributes: 'link_type_id'
    'link_type':
        file: 'benchmark/job/data/link_type.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id':   'INT NOT NULL PRIMARY KEY'
            'link': 'CHAR 32 NOT NULL'
        indexes:
            'id_link_type':
                attributes: 'id'
            'link_link_type':
                attributes: 'link'
systems:
    mutable:
        args: >-
            --backend WasmV8
            --cardinality-estimator Injected
            --use-cardinality-file benchmark/holistic-optimization/job-join_order_q21a.json
        configurations:
            'split (DPccp)':
                args: --optimizer-split --plan-enumerator DPccp
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'split (PEall)':
                args: --optimizer-split --plan-enumerator PEall
                pattern:
                    Optimization Time (algebraic): '^Compute the logical query plan:.*'
                    Optimization Time (physical): '^Compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'holistic (DPccp)':
                args: --optimizer-holistic --plan-enumerator DPccp
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
            'holistic (PEall)':
                args: --optimizer-holistic --plan-enumerator PEall
                pattern:
                    Optimization Time: '^Holistically compute the physical query plan:.*'
                    Execution Time: '^Execute query:.*'
                    Machine Code Execution Time: '^Execute machine code:.*'
        cases:
            dummy: >-
                SELECT lt.link, cn.name, t.title
                FROM
                    movie_companies AS mc,
                    company_type AS ct,
                    keyword AS k,
                    link_type AS lt,
                    movie_info AS mi,
                    company_name AS cn,
                    movie_keyword AS mk,
                    movie_link AS ml,
                    title AS t
                WHERE
                    ISNULL(mc.note) AND
                    ct.kind = "production companies" AND
                    k.keyword = "sequel" AND
                    lt.link LIKE "%follow%" AND
                    (mi.info = "Sweden" OR mi.info = "Norway" OR mi.info = "Denmark" OR mi.info = "Germany" OR mi.info = "Swedish" OR mi.info = "Norwegian" OR mi.info = "Denish" OR mi.info = "German") AND
                    cn.country_code != "[pl]" AND
                    (cn.name LIKE "%Film%" OR cn.name LIKE "%Warner%") AND
                    t.production_year >= 1950 AND
                    t.production_year <= 2000 AND
                    t.id = mc.movie_id AND
                    mc.company_id = cn.id AND
                    ml.movie_id = mc.movie_id AND
                    mc.company_type_id = ct.id AND
                    mc.movie_id = mi.movie_id AND
                    ml.movie_id = t.id AND
                    mk.keyword_id = k.id AND
                    mi.movie_id = t.id AND
                    lt.id = ml.link_type_id AND
                    t.id = mk.movie_id AND
                    ml.movie_id = mi.movie_id AND
                    mk.movie_id = mi.movie_id AND
                    mk.movie_id = mc.movie_id AND
                    ml.movie_id = mk.movie_id;
